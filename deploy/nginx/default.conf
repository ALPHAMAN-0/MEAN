server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed bundles are immutable; index.html must never be cached.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # NOTE: no trailing slash on proxy_pass. With one, nginx would strip the /api
  # prefix and every request would 404 — and the refresh cookie's
  # Path=/api/v1/auth would stop matching, breaking sessions in a way that looks
  # like a backend bug.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: deep links are routed by Angular, not by the filesystem.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
