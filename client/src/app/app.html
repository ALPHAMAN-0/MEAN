<header class="topbar">
  <a class="brand" routerLink="/tasks">MEAN<span>boilerplate</span></a>

  <nav>
    @if (store.isAuthenticated()) {
      <span class="who">{{ store.user()?.name }}</span>
      <button type="button" class="button button--ghost" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a routerLink="/register" routerLinkActive="active">Create account</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
